# Proxy inverso / balanceador delante de las réplicas de la app
# Docker Compose crea un registro DNS "app" que devuelve la IP de cada réplica,
# y nginx reparte las peticiones entre todas (round robin).

server {
    listen 8080;

    # DNS interno de docker. valid=10s hace que nginx vuelva a preguntar cada 10 segundos,
    # así si se escala con "docker compose up --scale app=N" toma las réplicas nuevas sin reiniciar
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8080;

    # healthcheck del propio proxy (no pasa a la app)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # si una réplica no responde se prueba con la siguiente
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # header para ver qué réplica atendió la petición (lo usa el smoke test del pipeline)
        add_header X-Upstream $upstream_addr always;
    }
}