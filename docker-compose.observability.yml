# Observabilidad: Prometheus + Grafana encima del despliegue de docker-compose.yml
# Uso (desde la raíz del repo):
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d --build
# Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (admin / admin)
#
#   app (réplicas) --/actuator/prometheus--> prometheus --> grafana (dashboard)

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: order-manager-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # guarda 7 días de métricas
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # solo accesible desde la máquina local
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    networks:
      - order-net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: order-manager-grafana
    restart: unless-stopped
    environment:
      # credenciales de laboratorio; en un entorno real irían en un secret
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # el dashboard del servicio se abre como página de inicio
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/order-manager.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    networks:
      - order-net

volumes:
  prometheus_data:
  grafana_data: