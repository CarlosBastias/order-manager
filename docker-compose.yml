# Orquestación local / despliegue simulado: proxy nginx + API order-manager (2 réplicas) + PostgreSQL
# Uso local:      docker compose up -d --build
# Escalar:        docker compose up -d --scale app=4
# En el pipeline: docker compose up -d --no-build --wait   (usa la imagen ya construida y escaneada)
#
#   cliente ──► proxy (nginx :8080) ──► app (réplica 1)
#                                  └──► app (réplica 2 ... N) ──► db (postgres)

services:
  db:
    image: postgres:16
    container_name: order-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: orderuser
      # la clave se toma de una variable de entorno (.env local o secret en el pipeline)
      # si no existe se usa la de desarrollo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpass}
    # solo se expone en localhost de la máquina, no hacia afuera
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - order-net

  app:
    # en el pipeline el tag es el sha del commit, en local queda como "local"
    image: order-manager:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    # sin container_name y sin puerto publicado: así se pueden levantar varias réplicas
    # (dos contenedores no pueden tener el mismo nombre ni usar el mismo puerto del host).
    # el tráfico entra por el proxy, la app solo queda expuesta dentro de la red
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # sobreescribe la clave de application-docker.properties con la misma variable que usa la db
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orderpass}
      # la JVM usa como máximo el 75% de la memoria límite del contenedor
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    expose:
      - "8080"
    # la imagen no trae curl, así que el healthcheck usa /dev/tcp de bash para pegarle al actuator
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      # 2 réplicas por defecto; se puede cambiar con --scale app=N
      replicas: 2
      # límites de recursos por réplica para que ninguna se coma toda la máquina
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          memory: 256M
    networks:
      - order-net

  proxy:
    # nginx sin root (corre con usuario normal y escucha en 8080)
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: order-manager-proxy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    # único punto de entrada: http://localhost:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - order-net

volumes:
  pg_data:

networks:
  order-net:
    driver: bridge