# Prometheus: recolecta las métricas de todas las réplicas de order-manager cada 5 segundos
global:
  scrape_interval: 5s
  evaluation_interval: 5s

# reglas de alerta: se evalúan cada 5 s y se ven en la pestaña Alerts de Prometheus
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # la app: se usa el DNS interno de docker -> "app" devuelve la IP de cada réplica,
  # así si se escala con --scale app=N Prometheus encuentra las réplicas nuevas solo
  - job_name: order-manager
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ app ]
        type: A
        port: 8080
        refresh_interval: 10s

  # métricas del pipeline CI/CD que publica scripts/sync-ci-metrics.ps1 en el Pushgateway
  # honor_labels mantiene las etiquetas originales (branch, stage) en vez de reemplazarlas
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: [ "pushgateway:9091" ]

  # el propio Prometheus (para saber que el monitoreo está vivo)
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]