# Dependabot: revisa una vez por semana si hay versiones nuevas o con parches de seguridad
# y abre un Pull Request automático para cada actualización.
# Esos PR pasan por el mismo pipeline (pruebas, snyk, sonar), así no se mete nada roto a main.
# OJO: los PR de dependabot no leen los secrets de Actions, por eso SONAR_TOKEN y SNYK_TOKEN
# también tienen que estar en Settings -> Secrets and variables -> Dependabot.
version: 2
updates:

  # dependencias de maven (pom.xml)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "deps(maven)"
    # las librerías de spring van juntas en un solo PR para no tener 10 PR distintos
    groups:
      spring:
        patterns:
          - "org.springframework*"

  # versiones de las actions usadas en .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 5
    target-branch: "main"
    commit-message:
      prefix: "deps(actions)"

  # imágenes base del Dockerfile (maven y eclipse-temurin)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 3
    target-branch: "main"
    commit-message:
      prefix: "deps(docker)"

  # imágenes del docker-compose.yml (postgres y nginx)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 3
    target-branch: "main"
    commit-message:
      prefix: "deps(compose)"