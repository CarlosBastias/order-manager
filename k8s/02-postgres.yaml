# PostgreSQL: 1 réplica con disco persistente
# la clave viene del Secret "order-manager-db", que NO está en el repo (se crea con kubectl, ver README)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: order-manager
  labels:
    app.kubernetes.io/name: postgres
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: order-manager
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: order-manager
spec:
  replicas: 1
  # la base no se puede tener duplicada escribiendo el mismo disco, por eso Recreate y no RollingUpdate
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: order-manager
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orderdb
            - name: POSTGRES_USER
              value: orderuser
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-manager-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [ "sh", "-c", "pg_isready -U orderuser -d orderdb" ]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [ "sh", "-c", "pg_isready -U orderuser -d orderdb" ]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: order-manager
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - port: 5432
      targetPort: 5432