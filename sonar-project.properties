# ============================================================
# Configuración de SonarCloud para order-manager
# La usa el job "code-analysis" del pipeline (sonarqube-scan-action)
# ============================================================

# OJO: cambiar estos dos valores por los que salen en SonarCloud al importar el repo
# (Administration -> Update Key / Information del proyecto)
sonar.projectKey=CAMBIAR_organizacion_order-manager
sonar.organization=CAMBIAR_organizacion

sonar.projectName=order-manager
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# ------------------------------------------------------------
# Código fuente y pruebas
# ------------------------------------------------------------
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# clases compiladas (vienen del job de build como artefacto)
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# ------------------------------------------------------------
# Cobertura (JaCoCo) y resultados de pruebas (Surefire)
# ------------------------------------------------------------
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# la clase main de spring boot no tiene lógica, no tiene sentido medirle cobertura
sonar.coverage.exclusions=**/OrderManagerApplication.java

# ------------------------------------------------------------
# Quality Gate
# el scanner espera la respuesta del Quality Gate y si no pasa termina con error,
# así el pipeline se detiene y no se construye ni despliega la imagen
# ------------------------------------------------------------
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
