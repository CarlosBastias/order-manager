# ============================================================
# Identidad
# ============================================================
spring.application.name=order-manager

# ============================================================
# Base de datos H2 en memoria (desarrollo y tests)
# ============================================================
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ============================================================
# Consola H2 (http://localhost:8098/h2-console)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# EP3 observabilidad: todas las métricas llevan la etiqueta application=order-manager
management.metrics.tags.application=${spring.application.name}
# histograma de tiempos de respuesta -> permite calcular p95/p99 de latencia en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# ============================================================
# Servidor
# ============================================================
server.port=8098
