# Perfil Docker - PostgreSQL
spring.application.name=order-manager

spring.datasource.url=jdbc:postgresql://db:5432/orderdb
spring.datasource.username=orderuser
spring.datasource.password=orderpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=8080

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# EP3 observabilidad: todas las métricas llevan la etiqueta application=order-manager
management.metrics.tags.application=${spring.application.name}
# histograma de tiempos de respuesta -> permite calcular p95/p99 de latencia en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# EP3 logging: logs en formato JSON (ECS) para que se puedan filtrar por nivel, logger o error
# en el perfil local (sin docker) se mantienen en texto normal para leerlos fácil
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=docker